# 团队乙申请自身的 8 卡份额；先观察未启用回收抢占时的排队。
apiVersion: batch/v1
kind: Job
metadata:
  name: l08-team-b-train
  namespace: default
  labels:
    lab: l08
    kueue.x-k8s.io/queue-name: team-b-queue
spec:
  suspend: true
  completions: 2
  parallelism: 2
  backoffLimit: 0
  template:
    metadata:
      labels:
        lab: l08
        train-job: team-b
      annotations:
        train/workers-needed: "2"
    spec:
      restartPolicy: Never
      containers:
        - name: worker
          # 只模拟资源占用，不会自行完成。
          image: registry.k8s.io/pause:3.10
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              nvidia.com/gpu: 4
