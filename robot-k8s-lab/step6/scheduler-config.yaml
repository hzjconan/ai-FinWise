# kube-scheduler 进程的配置，不是可 kubectl apply 的 API 资源。
# 由 scheduler.yaml 中的进程通过 ConfigMap 挂载后读取。
apiVersion: kubescheduler.config.k8s.io/v1
kind: KubeSchedulerConfiguration
leaderElection:
  leaderElect: false # 教学环境只运行一个副本，不参与默认调度器的选主。
profiles:
  - schedulerName: l08-binpack
    # 本实验只保留资源评分，隔离其他评分因素；默认 Filter 等阶段仍保留。
    plugins:
      score:
        disabled:
          - name: "*"
        enabled:
          - name: NodeResourcesFit
    pluginConfig:
      - name: NodeResourcesFit
        args:
          scoringStrategy:
            type: MostAllocated
            resources:
              - name: nvidia.com/gpu
                weight: 1
