- key: experience
  name: 投资经验
  description: 客户过往接触过的投资品类与时长
  anchors:
    1: 从未投资过任何理财产品
    2: 仅持有过活期、货币基金等低风险品
    3: 持有过定期理财、债券基金等中低风险品
    4: 持有过股票、混合基金，了解基本市场波动
    5: 长期参与股票、基金、衍生品交易，熟悉风险

- key: loss_tolerance
  name: 损失承受
  description: 客户对本金亏损的容忍度
  anchors:
    1: 完全不能接受任何本金亏损
    2: 可接受 5% 以内短期浮亏
    3: 可接受 10% 左右的阶段性亏损
    4: 可接受 20% 左右的较大亏损
    5: 可接受 30% 以上的大幅亏损

- key: income_stability
  name: 收入稳定性
  description: 客户现金流的稳定程度，决定能承受多长时间的资金锁定
  anchors:
    1: 收入极不稳定或无固定收入
    2: 收入波动较大，应急储备不足
    3: 收入基本稳定，有一定应急储备
    4: 收入稳定且有较充足储备
    5: 收入高且稳定，储备非常充足

- key: investment_horizon
  name: 投资期限
  description: 客户计划投资的时间跨度
  anchors:
    1: 1 年以内可能用到这笔钱
    2: 1–2 年
    3: 2–3 年
    4: 3–5 年
    5: 5 年以上长期投资

- key: volatility_tolerance
  name: 波动态度
  description: 客户在账户短期波动时的心理承受与行为反应
  anchors:
    1: 下跌一点就焦虑，会立即赎回
    2: 跌 5% 会非常焦虑，考虑赎回
    3: 跌 10% 会关注但一般不操作
    4: 跌 20% 仍能保持冷静，相信长期趋势
    5: 波动视为正常，甚至愿意在下跌时加仓
