[project]
name = "finwise-backend"
version = "0.1.0"
description = "FinWise - Financial Product Recommendation System Backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.0",
    "anthropic>=0.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]
prod = [
    "psycopg2-binary>=2.9.0",
]
# scratch/ 学习脚本（阶段四~五、L01~L02）用到的依赖；不影响生产安装。
# 安装：pip install -e ".[dev,scratch]"
# 版本钉死：是 2026-10 重建 venv 时实际验证可用的组合（torch 2.2.2 需要 numpy<2）。
scratch = [
    "numpy==1.26.4",
    "torch==2.2.2",
    "transformers==4.57.6",
    "sentence-transformers==2.7.0",
    "chromadb==1.5.9",
]

# 只把 app/ 打包。不写这一段时，setuptools 自动发现会看到 app / scratch / prompts / alembic
# 多个顶层目录而拒绝打包，导致 `pip install -e .` 失败（2026-10 重建 venv 时遇到）。
[tool.setuptools.packages.find]
include = ["app*"]

